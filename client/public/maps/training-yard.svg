<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Training Yard: a fictional practice map with two sites, three lanes and two spawns">
  <!-- Original schematic drawn for Game Sense. Not taken from any game. Light blocks are solid buildings. -->
  <rect width="1000" height="1000" fill="#131822"/>
  <rect x="20" y="20" width="960" height="960" fill="none" stroke="#2a3344" stroke-width="12"/>

  <!-- bomb sites -->
  <rect x="90" y="120" width="220" height="200" fill="#1b2230" stroke="#3ddc97" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="690" y="120" width="220" height="200" fill="#1b2230" stroke="#3ddc97" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="200" y="245" font-family="sans-serif" font-size="90" font-weight="700" fill="#2a3344" text-anchor="middle">A</text>
  <text x="800" y="245" font-family="sans-serif" font-size="90" font-weight="700" fill="#2a3344" text-anchor="middle">B</text>

  <!-- buildings -->
  <g fill="#2a3344">
    <rect x="380" y="170" width="240" height="70"/>
    <rect x="280" y="380" width="120" height="400"/>
    <rect x="600" y="380" width="120" height="400"/>
    <rect x="60" y="840" width="220" height="100"/>
    <rect x="720" y="840" width="220" height="100"/>
    <rect x="120" y="150" width="50" height="50"/>
    <rect x="830" y="250" width="50" height="50"/>
  </g>

  <!-- the window in the mid building -->
  <rect x="470" y="170" width="60" height="70" fill="#131822"/>
</svg>
